# =====================================================
# Nginx — Phase 2: HTTPS production config
# Replace YOUR_DOMAIN with actual domain (e.g. api.yourdomain.com)
# Requires Let's Encrypt cert at /etc/nginx/certs/live/YOUR_DOMAIN/
# =====================================================

# Rate limiting zone (basic DDoS protection)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

server {
    listen 80;
    server_name YOUR_DOMAIN;

    # Let's Encrypt ACME challenge renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN;

    # TLS certificate (Let's Encrypt)
    ssl_certificate     /etc/nginx/certs/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/YOUR_DOMAIN/privkey.pem;

    # Modern TLS settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Request size limit (for CSV uploads)
    client_max_body_size 10m;

    # ─── API routes → Express backend ───
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ─── Bull Board admin UI ───
    # Protect with basic auth in production
    location /admin/queues {
        # Uncomment to add basic auth protection:
        # auth_basic "ReachInbox Queue Monitor";
        # auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ─── Health check ───
    location /health {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # ─── Default fallback ───
    location / {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
